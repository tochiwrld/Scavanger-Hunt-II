<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14131b">
<title>No network · PrimaHunt</title>
<style>
  :root{--bg:#14131b;--card:#1c1b25;--fg:#f4f2ea;--muted:#a19dae;--primary:#ffd21f;--border:#2c2a38}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
  .box{max-width:360px;width:100%;text-align:center}
  .mark{width:72px;height:72px;margin:0 auto 22px;border-radius:20px;background:var(--primary);color:#14131b;display:grid;place-items:center;font:900 38px/1 system-ui,sans-serif;position:relative}
  .mark:after{content:"";position:absolute;inset:-9px;border:3px dashed color-mix(in oklab,var(--primary) 55%,transparent);border-radius:26px;animation:spin 14s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  h1{font:900 30px/1.05 system-ui,-apple-system,sans-serif;letter-spacing:-.03em;text-transform:uppercase;margin:0 0 12px}
  h1 em{font-style:normal;color:var(--primary)}
  p{color:var(--muted);font-size:16px;line-height:1.5;margin:0 0 24px}
  button{width:100%;height:52px;border:0;border-radius:16px;background:var(--primary);color:#14131b;font:800 16px/1 inherit;cursor:pointer}
  button:active{transform:scale(.97)}
  .tip{margin-top:18px;font-size:13px;color:var(--muted)}
  @media (prefers-reduced-motion:reduce){.mark:after{animation:none}}
</style>
</head>
<body>
  <main class="box">
    <div class="mark" aria-hidden="true">P</div>
    <h1>No network, <em>hunter.</em></h1>
    <p>Reconnect to keep hunting. Your finds and pips are safe, they'll be right here when you're back.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <div class="tip">We'll reload by ourselves as soon as you're back online.</div>
  </main>
  <script>addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
